name: deploy

# Build mathlib.tamnd.com with mlib from mathlib-agent, check it, and deploy it to the Cloudflare Worker mathlib. The site reads the newest index of the release index. The daily run is the edge build of spec 13: it takes the index of the day after the workflow index of mathlib-lean writes it. A pull request builds and checks the site but does not deploy it.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "30 7 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  site:
    name: build, check and deploy the site
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          path: content
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          repository: tamnd/mathlib-agent
          ref: main
          path: toolchain
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          repository: tamnd/mathlib-handbook
          ref: main
          path: book
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: toolchain/go.mod
          cache-dependency-path: toolchain/go.sum
      - name: build mlib
        working-directory: toolchain
        run: go build -trimpath -o "$RUNNER_TEMP/mlib" ./cmd/mlib
      - name: check the map
        run: |
          "$RUNNER_TEMP/mlib" check -map content
      - name: get the newest index
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          "$RUNNER_TEMP/mlib" index fetch -commit latest -out index
      - name: build the site
        run: |
          "$RUNNER_TEMP/mlib" site build -index index -map content -book book -out content/public -url https://mathlib.tamnd.com
      - name: check the site
        run: |
          "$RUNNER_TEMP/mlib" site check -out content/public
      - name: deploy
        if: github.event_name != 'pull_request'
        working-directory: content
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          COMMIT: ${{ github.sha }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::warning::the secrets CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID are not set, so the site is not deployed"
            exit 0
          fi
          npx --yes wrangler@4 deploy --message "mathlib $COMMIT"
