# The milestones of spec 15. Each milestone has a tracking issue with the label milestone and a GitHub milestone with the same title. A closed milestone has the date when it closed. The volumes of a milestone are the volumes that its exit criteria name. They set the weight of a volume in the work queue of mlib (spec 11.5): 1 for the current milestone, 0.5 for the next one and 0.2 for the rest.
milestones:
